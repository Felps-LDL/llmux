# Ambiente local completo: `make up` sobe tudo, `make down` derruba.
# As portas publicadas ficam presas em 127.0.0.1 para nada fora desta máquina
# alcançar o banco ou o gateway sem autenticação.
name: llmux

services:
  gateway:
    build:
      context: ..
    image: llmux-gateway:dev
    environment:
      LLMUX_CONFIG: /config.json
      # sslmode=disable só porque o tráfego não sai da rede interna do compose.
      LLMUX_DATABASE_URL: postgres://llmux:${POSTGRES_PASSWORD:-llmux}@postgres:5432/llmux?sslmode=disable
      LLMUX_REDIS_URL: redis://redis:6379/0
      # Sem depends_on no Jaeger: observabilidade é ferramenta de quem opera e não
      # pode impedir o gateway de subir. Com o Jaeger fora, só os traces se perdem.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./config.compose.json:/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      # As métricas mostram custos e ids de chave: só nesta máquina.
      - "127.0.0.1:2112:2112"
    depends_on:
      # Sem esperar o modelo, os primeiros pedidos falhariam com 404 do Ollama.
      ollama-pull:
        condition: service_completed_successfully
      # O gateway não sobe sem banco: sem esperar o healthcheck, ele falharia ao
      # conectar enquanto o Postgres ainda inicializa.
      postgres:
        condition: service_healthy
      # O gateway sobe sem o Redis (o rate limit falha aberto), mas esperar evita
      # que ele comece com o rate limit desligado.
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama-models:/root/.ollama
    # Sem ports: só o gateway fala com ele, e a 11434 do host pode estar em uso
    # por um Ollama instalado na máquina.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Baixa o modelo e termina. Roda a cada `up`, mas com o volume já cheio só
  # confere o que existe.
  ollama-pull:
    image: ollama/ollama:0.40.14
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    depends_on:
      ollama:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: llmux
      POSTGRES_DB: llmux
      # Padrão só para desenvolvimento; a porta presa em 127.0.0.1 é o que o torna
      # aceitável.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmux}
    volumes:
      # A partir do Postgres 18, a imagem guarda os dados num subdiretório por
      # versão e espera o volume aqui, e não em /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Processo de pé não basta: o banco só aceita conexões depois de inicializar.
      test: ["CMD", "pg_isready", "-U", "llmux", "-d", "llmux"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # Sem persistência: contadores de rate limit e cache se reconstroem sozinhos, e
    # perdê-los num restart custa no máximo algumas respostas recalculadas. Não basta
    # não declarar volume: a imagem tem um volume anônimo em /data, e o Redis salva
    # um snapshot ao parar; sem estas flags, o estado sobreviveria ao restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.12.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  # O all-in-one guarda os traces na memória: some num restart, o que basta para
  # desenvolver. Em produção, ele teria um banco por trás.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      # Leitura sem login, só porque a porta está presa em 127.0.0.1; para editar,
      # entre com admin/admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llmux.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  ollama-models:
  postgres-data:
