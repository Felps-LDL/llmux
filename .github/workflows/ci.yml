name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token do workflow só precisa ler o repo; nada aqui publica ou escreve.
permissions:
  contents: read

# Um push novo no mesmo PR torna a execução anterior inútil.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A action só instala; quem roda é o Makefile, para o CI executar o mesmo
      # comando que roda localmente.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make docker-build TAG=${{ github.sha }}
